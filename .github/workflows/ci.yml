name: CI

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and typecheck
    # npm test/build prepare the locked Office payload; Linux is not a
    # supported Desktop target. Keep the complete gate on a native target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native Office and PPT build inputs
        uses: actions/cache@v4
        with:
          path: |
            .build/office-downloads
            .build/office-template-cache
            .build/ppt-runtime
          key: desktop-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/office-runtime/**', 'scripts/*ppt*', 'scripts/ppt/**', 'packages/dsh-desktop-office/**', 'packages/ppt-runtime/**', 'packages/office-runtime/**', 'patches/**', 'package-lock.json') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-${{ runner.arch }}-
      - run: npm run typecheck
      - run: npm run build
      # Build prepared the native payload; run the same full suite without pretest.
      - run: npm exec -- vitest run

  native-runtime:
    name: Native Harness/Office (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native Office and PPT build inputs
        uses: actions/cache@v4
        with:
          path: |
            .build/office-downloads
            .build/office-template-cache
            .build/ppt-runtime
          key: desktop-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/office-runtime/**', 'scripts/*ppt*', 'scripts/ppt/**', 'packages/dsh-desktop-office/**', 'packages/ppt-runtime/**', 'packages/office-runtime/**', 'patches/**', 'package-lock.json') }}
          restore-keys: |
            desktop-runtime-${{ runner.os }}-${{ runner.arch }}-
      - run: node scripts/verify/verify-target.mjs ${{ runner.os == 'Windows' && 'win32' || 'darwin' }} ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: npm run build
      - run: node scripts/check-desktop-profile.cjs
      - if: runner.os == 'macOS'
        run: node scripts/verify/verify-image-electron.mjs
      - if: runner.os == 'Windows'
        run: node scripts/check-windows-titlebar-layout.cjs
      # Package this job's validated build without rebuilding the Office payload.
      - run: npm exec -- electron-builder --dir --config electron-builder.dev.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - if: runner.os == 'Windows'
        run: node scripts/check-desktop-profile.cjs dist-dev/win-unpacked/resources/app.asar dist-dev/win-unpacked/resources "dist-dev/win-unpacked/DSH Desktop Dev.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-${{ matrix.os }}
          path: .build/desktop-profile-smoke/*.png
          if-no-files-found: ignore
