<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light; --splash-matte-light: #f8f8f6; --splash-matte-dark: #141416; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: var(--splash-matte-light); }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; }
        body { background: var(--splash-matte-dark); }
      }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .markFrame { display: grid; place-items: center; width: 100%; transform: translateY(-80px); }
      .mark { display: block; width: min(420px, 100%); height: auto; object-fit: contain; }
    </style>
  </head>
  <body>
    <main aria-label="DSH Desktop">
      <div class="markFrame" aria-hidden="true">
        <picture>
          <source srcset="dsh-loader-dark.gif" media="(prefers-color-scheme: dark)" />
          <img class="mark" src="dsh-loader.gif" width="640" height="360" alt="" />
        </picture>
      </div>
    </main>
  </body>
</html>
